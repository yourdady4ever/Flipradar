[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flipradar"
version = "0.1.0"
description = "FLIP RADAR - resale arbitrage intelligence for the Mexican market (self-hosted, zero mandatory cost)"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
flipradar = "flipradar.cli:main"

[tool.setuptools.packages.find]
include = ["flipradar*"]

[tool.setuptools.package-data]
flipradar = ["web/templates/*.html", "web/static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
