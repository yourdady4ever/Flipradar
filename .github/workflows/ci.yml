name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check flipradar tests
      - name: Test
        run: python -m pytest -q

  android-offline:
    # Builds the APK with the SDK command-line tools only (same script used in restricted sandboxes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Kotlin compiler
        run: |
          curl -sSL -o /tmp/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip
          unzip -q /tmp/kotlinc.zip -d /opt
      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Fetch JVM test jars
        run: |
          mkdir -p /opt/m2 && cd /opt/m2
          for a in junit/junit/4.13.2/junit-4.13.2.jar org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar org/json/json/20250517/json-20250517.jar; do
            curl -sSfLO "https://repo1.maven.org/maven2/$a"
          done
      - name: Unit tests
        run: KOTLINC=/opt/kotlinc/bin/kotlinc bash android/scripts/run-unit-tests.sh
      - name: Build APK
        run: KOTLINC=/opt/kotlinc/bin/kotlinc bash android/scripts/build-offline.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flipradar-debug-apk-offline
          path: android/build/outputs/*.apk

  android-gradle:
    # Standard Android Gradle Plugin build (needs Google Maven, available on GitHub runners).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and unit-test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: flipradar-debug-apk-gradle
          path: android/app/build/outputs/apk/debug/*.apk
