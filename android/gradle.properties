# Gradle / Android build properties for the FLIP RADAR Android client.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
# The app intentionally uses only Android framework APIs + Kotlin stdlib (no AndroidX), so it can also be
# built offline with scripts/build-offline.sh.
android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official
